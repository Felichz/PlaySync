<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>PlaySync · Watch YouTube together</title>
    <meta name="description" content="Watch YouTube videos in sync with the people you care about, from any device." />
    <meta name="theme-color" content="#0f0b10" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Figtree:wght@400..700&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="PlaySync" />
    <script>
      // Theme before first paint, so a light room never flashes dark (and the other way round).
      // Saved choice in localStorage 'playsync:theme' ('light' | 'dark'); otherwise the system's.
      (function () {
        var t = null;
        try {
          t = localStorage.getItem('playsync:theme');
        } catch (e) {}
        if (t !== 'light' && t !== 'dark') {
          t = window.matchMedia && matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        }
        var root = document.documentElement;
        root.setAttribute('data-theme', t);
        root.style.colorScheme = t;
        document.querySelector('meta[name="theme-color"]').setAttribute('content', t === 'light' ? '#f3ebe4' : '#0f0b10');
        document
          .querySelector('meta[name="apple-mobile-web-app-status-bar-style"]')
          .setAttribute('content', t === 'light' ? 'default' : 'black-translucent');
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
