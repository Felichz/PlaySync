# Render blueprint: creates the service with the right configuration.
# Render picks this file up automatically when creating a "Web Service" from the repo.
services:
  - type: web
    name: playsync
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: GIPHY_API_KEY
        sync: false
